name: educrea
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: educrea
      POSTGRES_USER: educrea
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educrea -d educrea"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  api:
    build: ../apps/api
    environment:
      EDUCREA_DATABASE_URL_FILE: /run/secrets/database_url
      EDUCREA_CREDENTIAL_KEYS_FILE: /run/secrets/credential_keys
      EDUCREA_COOKIE_SECURE: "true"
      EDUCREA_GEMINI_FREE_MODELS: ${EDUCREA_GEMINI_FREE_MODELS:-}
      EDUCREA_OPENROUTER_FREE_MODELS: ${EDUCREA_OPENROUTER_FREE_MODELS:-}
      EDUCREA_GROQ_FREE_MODELS: ${EDUCREA_GROQ_FREE_MODELS:-}
      EDUCREA_OLLAMA_FREE_MODELS: ${EDUCREA_OLLAMA_FREE_MODELS:-}
      EDUCREA_OLLAMA_BASE_URL: ${EDUCREA_OLLAMA_BASE_URL:-}
      EDUCREA_FREE_AI_ENABLED: ${EDUCREA_FREE_AI_ENABLED:-false}
      EDUCREA_FREE_AI_MONTHLY_CREDITS: ${EDUCREA_FREE_AI_MONTHLY_CREDITS:-10000}
      EDUCREA_FREE_AI_CREDITS_PER_USD: ${EDUCREA_FREE_AI_CREDITS_PER_USD:-100000}
      EDUCREA_FREE_AI_MIN_CREDITS_PER_REQUEST: ${EDUCREA_FREE_AI_MIN_CREDITS_PER_REQUEST:-1}
      EDUCREA_FREE_AI_MINUTE_REQUEST_LIMIT: ${EDUCREA_FREE_AI_MINUTE_REQUEST_LIMIT:-15}
      EDUCREA_FREE_AI_HOURLY_REQUEST_LIMIT: ${EDUCREA_FREE_AI_HOURLY_REQUEST_LIMIT:-30}
      EDUCREA_FREE_AI_DAILY_REQUEST_LIMIT: ${EDUCREA_FREE_AI_DAILY_REQUEST_LIMIT:-100}
      EDUCREA_FREE_AI_MAX_CONCURRENT_REQUESTS: ${EDUCREA_FREE_AI_MAX_CONCURRENT_REQUESTS:-1}
      EDUCREA_FREE_AI_MAX_INPUT_TOKENS: ${EDUCREA_FREE_AI_MAX_INPUT_TOKENS:-32768}
      EDUCREA_FREE_AI_MAX_CONTEXT_TOKENS: ${EDUCREA_FREE_AI_MAX_CONTEXT_TOKENS:-30000}
      EDUCREA_FREE_AI_MAX_OUTPUT_TOKENS: ${EDUCREA_FREE_AI_MAX_OUTPUT_TOKENS:-4096}
      EDUCREA_FREE_AI_GLOBAL_DAILY_BUDGET_USD: ${EDUCREA_FREE_AI_GLOBAL_DAILY_BUDGET_USD:-0}
      EDUCREA_FREE_AI_GLOBAL_MONTHLY_BUDGET_USD: ${EDUCREA_FREE_AI_GLOBAL_MONTHLY_BUDGET_USD:-0}
      EDUCREA_FREE_AI_REQUEST_TIMEOUT_SECONDS: ${EDUCREA_FREE_AI_REQUEST_TIMEOUT_SECONDS:-120}
      EDUCREA_FREE_AI_RESERVATION_TTL_SECONDS: ${EDUCREA_FREE_AI_RESERVATION_TTL_SECONDS:-900}
      EDUCREA_FREE_AI_DEEPSEEK_FALLBACK_TO_QWEN: ${EDUCREA_FREE_AI_DEEPSEEK_FALLBACK_TO_QWEN:-false}
      EDUCREA_QWEN_ENABLED: ${EDUCREA_QWEN_ENABLED:-true}
      EDUCREA_QWEN_MODEL: ${EDUCREA_QWEN_MODEL:-}
      EDUCREA_QWEN_BASE_URL: ${EDUCREA_QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      EDUCREA_QWEN_INPUT_COST_PER_MILLION: ${EDUCREA_QWEN_INPUT_COST_PER_MILLION:-0}
      EDUCREA_QWEN_OUTPUT_COST_PER_MILLION: ${EDUCREA_QWEN_OUTPUT_COST_PER_MILLION:-0}
      EDUCREA_DEEPSEEK_ENABLED: ${EDUCREA_DEEPSEEK_ENABLED:-true}
      EDUCREA_DEEPSEEK_MODEL: ${EDUCREA_DEEPSEEK_MODEL:-}
      EDUCREA_DEEPSEEK_BASE_URL: ${EDUCREA_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      EDUCREA_DEEPSEEK_INPUT_COST_PER_MILLION: ${EDUCREA_DEEPSEEK_INPUT_COST_PER_MILLION:-0}
      EDUCREA_DEEPSEEK_OUTPUT_COST_PER_MILLION: ${EDUCREA_DEEPSEEK_OUTPUT_COST_PER_MILLION:-0}
      EDUCREA_PUBLIC_BASE_URL: ${EDUCREA_PUBLIC_BASE_URL:-}
      EDUCREA_SMTP_HOST: ${EDUCREA_SMTP_HOST:-}
      EDUCREA_SMTP_PORT: ${EDUCREA_SMTP_PORT:-587}
      EDUCREA_SMTP_SECURITY: ${EDUCREA_SMTP_SECURITY:-starttls}
      EDUCREA_SMTP_USERNAME: ${EDUCREA_SMTP_USERNAME:-}
      EDUCREA_SMTP_FROM: ${EDUCREA_SMTP_FROM:-}
      EDUCREA_BETA_INVITATION_DAYS: ${EDUCREA_BETA_INVITATION_DAYS:-7}
      EDUCREA_BETA_INVITATION_DAILY_LIMIT: ${EDUCREA_BETA_INVITATION_DAILY_LIMIT:-50}
      EDUCREA_BETA_INVITATION_COOLDOWN_SECONDS: ${EDUCREA_BETA_INVITATION_COOLDOWN_SECONDS:-300}
      EDUCREA_PAID_MODELS_JSON: ${EDUCREA_PAID_MODELS_JSON:-{}}
      EDUCREA_IMAGE_MODELS_JSON: ${EDUCREA_IMAGE_MODELS_JSON:-{}}
      EDUCREA_AI_DAILY_IMAGE_REQUESTS: ${EDUCREA_AI_DAILY_IMAGE_REQUESTS:-20}
      EDUCREA_IMAGE_REQUEST_TIMEOUT_SECONDS: ${EDUCREA_IMAGE_REQUEST_TIMEOUT_SECONDS:-120}
      EDUCREA_VIDEO_MODELS_JSON: ${EDUCREA_VIDEO_MODELS_JSON:-{}}
      EDUCREA_AI_DAILY_VIDEO_REQUESTS: ${EDUCREA_AI_DAILY_VIDEO_REQUESTS:-10}
      EDUCREA_VIDEO_REQUEST_TIMEOUT_SECONDS: ${EDUCREA_VIDEO_REQUEST_TIMEOUT_SECONDS:-300}
      EDUCREA_AI_MAX_USER_BUDGET_MICROUSD: ${EDUCREA_AI_MAX_USER_BUDGET_MICROUSD:-20000000}
      EDUCREA_OIDC_ISSUER: ${EDUCREA_OIDC_ISSUER:-}
      EDUCREA_OIDC_CLIENT_ID: ${EDUCREA_OIDC_CLIENT_ID:-}
      EDUCREA_OIDC_REDIRECT_URI: ${EDUCREA_OIDC_REDIRECT_URI:-}
      EDUCREA_LOCAL_AUTH_ENABLED: ${EDUCREA_LOCAL_AUTH_ENABLED:-true}
      EDUCREA_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      EDUCREA_AI_DAILY_PERSONAL_REQUESTS: ${EDUCREA_AI_DAILY_PERSONAL_REQUESTS:-200}
      EDUCREA_AI_DAILY_USER_REQUESTS: ${EDUCREA_AI_DAILY_USER_REQUESTS:-20}
      EDUCREA_AI_DAILY_INSTALLATION_REQUESTS: ${EDUCREA_AI_DAILY_INSTALLATION_REQUESTS:-200}
      EDUCREA_AI_DAILY_USER_TOKENS: ${EDUCREA_AI_DAILY_USER_TOKENS:-400000}
      EDUCREA_AI_DAILY_INSTALLATION_TOKENS: ${EDUCREA_AI_DAILY_INSTALLATION_TOKENS:-4000000}
    # Optional secrets (Qwen/DeepSeek for the included AI, SMTP password) live in compose.included.yaml and compose.mail.yaml.
    secrets: [database_url, credential_keys, oidc_client_secret]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  web:
    build: ../apps/web
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]
  proxy:
    image: caddy:2-alpine
    environment:
      EDUCREA_DOMAIN: ${EDUCREA_DOMAIN:?Set EDUCREA_DOMAIN}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: ["80:80", "443:443"]
    depends_on: [web]
    networks: [internal]
secrets:
  db_password:
    file: ../secrets/db_password
  database_url:
    file: ../secrets/database_url
  credential_keys:
    file: ../secrets/credential_keys
  oidc_client_secret:
    file: ../secrets/oidc_client_secret
networks:
  internal: {}
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}

